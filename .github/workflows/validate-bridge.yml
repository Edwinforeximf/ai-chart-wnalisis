name: Validate MT Bridge API
on:
  pull_request:
  push:
    branches: [main]
jobs:
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AI-Trading-Terminal-Pro-GitHub-Railway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx
      - name: Compile and test
        run: |
          python -m py_compile app.py live_bridge.py strategy_bridge.py fundamental_gate.py
          pytest -q tests
